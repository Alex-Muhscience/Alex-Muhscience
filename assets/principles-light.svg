class="m" x="28" y="240" font-size="13" font-weight="700" letter-spacing="1.2" fill="#dc2626">04</text><text class="s t" x="28" y="266" font-size="20" font-weight="700" letter-spacing="-.3">Security is architecture</text><text class="s mu" x="28" y="292" font-size="15.5">Access control, MFA and audit trails are</text><text class="s mu" x="28" y="314" font-size="15.5">designed into the first schema, not bolted</text><text class="s mu" x="28" y="336" font-size="15.5">on.</text><rect x="409" y="201" width="382" height="174" rx="16" fill="#f7f9fc" stroke="#d5dce6"/><rect x="436" y="201" width="48" height="3" rx="1.5" fill="#0f766e"/><text class="m" x="436" y="240" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f766e">05</text><text class="s t" x="436" y="266" font-size="20" font-weight="700" letter-spacing="-.3">Measure, then optimise</text><text class="s mu" x="436" y="292" font-size="15.5">Find the real bottleneck with production-</text><text class="s mu" x="436" y="314" font-size="15.5">sized data, then fix that one thing.</text><rect x="817" y="201" width="382" height="174" rx="16" fill="#f7f9fc" stroke="#d5dce6"/><rect x="844" y="201" width="48" height="3" rx="1.5" fill="#15803d"/><text class="m" x="844" y="240" font-size="13" font-weight="700" letter-spacing="1.2" fill="#15803d">06</text><text class="s t" x="844" y="266" font-size="20" font-weight="700" letter-spacing="-.3">Built to be operated</text><text class="s mu" x="844" y="292" font-size="15.5">Health checks, correlated logs, repeatable</text><text class="s mu" x="844" y="314" font-size="15.5">deploys and tested restores ship with the</text><text class="s mu" x="844" y="336" font-size="15.5">feature.</text>
