x="16" fill="#0e1a2e" stroke="#22344f"/><rect x="28" y="401" width="48" height="3" rx="1.5" fill="#ff5a6a"/><text class="m" x="28" y="440" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ff5a6a">07</text><text class="s t" x="28" y="466" font-size="20" font-weight="700" letter-spacing="-.3">Security is architecture</text><text class="s mu" x="28" y="492" font-size="15.5">Access control, MFA, row-level security</text><text class="s mu" x="28" y="514" font-size="15.5">and audit trails are designed into the</text><text class="s mu" x="28" y="536" font-size="15.5">first schema.</text><rect x="409" y="401" width="382" height="174" rx="16" fill="#0e1a2e" stroke="#22344f"/><rect x="436" y="401" width="48" height="3" rx="1.5" fill="#6cb2f0"/><text class="m" x="436" y="440" font-size="13" font-weight="700" letter-spacing="1.2" fill="#6cb2f0">08</text><text class="s t" x="436" y="466" font-size="20" font-weight="700" letter-spacing="-.3">Measure, then optimise</text><text class="s mu" x="436" y="492" font-size="15.5">Find the real bottleneck with production-</text><text class="s mu" x="436" y="514" font-size="15.5">sized data, then fix that one thing. Query</text><text class="s mu" x="436" y="536" font-size="15.5">budgets fail the build.</text><rect x="817" y="401" width="382" height="174" rx="16" fill="#0e1a2e" stroke="#22344f"/><rect x="844" y="401" width="48" height="3" rx="1.5" fill="#6cb2f0"/><text class="m" x="844" y="440" font-size="13" font-weight="700" letter-spacing="1.2" fill="#6cb2f0">09</text><text class="s t" x="844" y="466" font-size="20" font-weight="700" letter-spacing="-.3">Built to be operated</text><text class="s mu" x="844" y="492" font-size="15.5">Health checks, correlated logs, verified</text><text class="s mu" x="844" y="514" font-size="15.5">backups and tested restores ship with the</text><text class="s mu" x="844" y="536" font-size="15.5">feature.</text>
