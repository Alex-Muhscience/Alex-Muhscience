<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#5b9cf8"/><stop offset="1" stop-color="#f2605c"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="300" fill="#0f1622"/>
<rect width="1200" height="300" fill="url(#dots)" mask="url(#m)"/>
<rect width="1200" height="300" fill="url(#glow)"/>
