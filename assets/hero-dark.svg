<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Alex Murimi Kamau — full-stack developer, systems that run in production">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.t{fill:#e6edf3}.mu{fill:#8b98a9}.ac{fill:#5b9cf8}.ok{fill:#3fb950}.warn{fill:#d6a13a}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rot{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}.p{animation:pulse 2.4s ease-in-out infinite}.r{opacity:0;animation:rot 16s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.r1{opacity:1!important}}</style>
