<text class="s t" x="30" y="76" font-size="24" font-weight="700" letter-spacing="-.4">Secure File Sharing Platform</text>
<text class="s mu" x="30" y="104" font-size="14.5">Encrypted file sharing for teams: resumable uploads</text><text class="s mu" x="30" y="124" font-size="14.5">encrypted chunk by chunk, malware scanning before release</text><text class="s mu" x="30" y="144" font-size="14.5">and verified recipients.</text>
