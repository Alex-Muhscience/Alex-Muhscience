<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Secure File Sharing Platform (in development · private). Encrypted file sharing for teams: resumable uploads encrypted chunk by chunk, malware scanning before release and verified recipients. Flow: Chunked upload, AES-256-GCM at rest, ClamAV quarantine, Verified download. Stack: Node.js, Express, MongoDB, S3, ClamAV, libsodium, Docker.">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.t{fill:#e6edf3}.mu{fill:#8b98a9}.ac{fill:#5b9cf8}.ok{fill:#3fb950}.warn{fill:#d6a13a}@keyframes flow{to{stroke-dashoffset:-20}}.l{fill:none;stroke:#8b98a9;stroke-width:1.6;stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.r1{opacity:1!important}}</style>
