<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="BusinessOS (in development · private). Multi-tenant operating system for SMEs: CRM, sales, procurement, inventory, finance, HR and projects on one governed data model. Flow: Tenant request, Row-level security, Idempotent write, Outbox + webhooks. Stack: Laravel 13, Next.js 16, PostgreSQL 18, Redis, Docker, nginx.">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.t{fill:#0f172a}.mu{fill:#566273}.ac{fill:#2563eb}.ok{fill:#15803d}.warn{fill:#a16207}@keyframes flow{to{stroke-dashoffset:-20}}.l{fill:none;stroke:#566273;stroke-width:1.6;stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.r1{opacity:1!important}}</style>
<rect x="1" y="1" width="998" height="174" rx="14" fill="#f7f9fc" stroke="#d5dce6"/>
<rect x="1" y="26" width="4" height="124" rx="2" fill="#2563eb"/>
<text class="m" x="30" y="42" font-size="12.5" letter-spacing="1.2"><tspan fill="#2563eb" font-weight="700">01</tspan><tspan class="mu">  IN DEVELOPMENT · PRIVATE</tspan></text>
<text class="s t" x="30" y="76" font-size="24" font-weight="700" letter-spacing="-.4">BusinessOS</text>
<text class="s mu" x="30" y="104" font-size="14.5">Multi-tenant operating system for SMEs: CRM, sales,</text><text class="s mu" x="30" y="124" font-size="14.5">procurement, inventory, finance, HR and projects on one</text><text class="s mu" x="30" y="144" font-size="14.5">governed data model.</text>
