<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Chania Finance Consultancy (in development · sole technical owner). Finance-training platform: catalogue search at scale, calendar booking by venue, organisation invoicing, and admin and trainer portals. Flow: Course search, Venue + calendar, Team registration, Invoice + Paystack. Stack: Laravel 12, Livewire 4, Alpine.js, Tailwind, MySQL, DomPDF.">
