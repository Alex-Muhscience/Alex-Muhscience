<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Alex Murimi Kamau — full-stack developer, systems that run in production. The stack, top to bottom: interface: React · Next.js · TypeScript; application: Node.js · Laravel · FastAPI · Flask; data: PostgreSQL · MySQL · MongoDB · Redis; infrastructure: Linux · Docker · nginx · CI/CD.">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.t{fill:#0f172a}.mu{fill:#566273}.ac{fill:#2563eb}.ok{fill:#15803d}.warn{fill:#a16207}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rot{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.p{animation:pulse 2.4s ease-in-out infinite}.r{opacity:0;animation:rot 16s linear infinite}.b{animation:bob 5s ease-in-out infinite}
