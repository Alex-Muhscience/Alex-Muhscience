<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Secure File Sharing (In development · private). Encrypted file sharing for teams: resumable uploads sealed chunk by chunk with AES-256-GCM, ClamAV quarantine, verified recipients. ~180 MiB peak memory moving a 1 GiB file. Stack: Node.js, MongoDB, S3, ClamAV, libsodium.">
